name: Supply-chain security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/.buildx-cache
            .cache/devcontainer
          key: devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-1.15.8-${{ hashFiles('.devcontainer/Dockerfile', 'go.mod', 'go.sum', 'Makefile') }}
          restore-keys: |
            devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-1.15.8-
      - name: Build devcontainer image
        run: |
          make image \
            DOCKER_BUILD='docker buildx build --load' \
            DEVCONTAINER_BUILD_FLAGS='--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max'
      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Run vulnerability policy checks
        run: make security
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json

  submit-sbom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sbom
      - uses: advanced-security/spdx-dependency-submission-action@8b97fad313c1af2c5c490e1f72ab338371eb92f6 # v0.3.2
        with:
          filePath: sbom.spdx.json
