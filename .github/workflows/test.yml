name: Test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Go, build, and generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/.buildx-cache
            .cache/devcontainer
          key: devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-1.15.8-${{ hashFiles('.devcontainer/Dockerfile', 'go.mod', 'go.sum', 'Makefile') }}
          restore-keys: |
            devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-1.15.8-
      - name: Build devcontainer image
        run: |
          make image \
            DOCKER_BUILD='docker buildx build --load' \
            DEVCONTAINER_BUILD_FLAGS='--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max'
      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Verify Terraform version
        run: make terraform-version
      - name: Test
        run: make test
      - name: Vet
        run: make lint
      - name: Build
        run: make build
      - name: Verify generated documentation
        run: make generate-check

  examples:
    name: Examples (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.6.6", "1.15.8"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/.buildx-cache
            .cache/devcontainer
          key: devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-${{ matrix.terraform }}-${{ hashFiles('.devcontainer/Dockerfile', 'go.mod', 'go.sum', 'Makefile') }}
          restore-keys: |
            devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-${{ matrix.terraform }}-
      - name: Build devcontainer image
        run: |
          make image \
            TERRAFORM_VERSION=${{ matrix.terraform }} \
            DOCKER_BUILD='docker buildx build --load' \
            DEVCONTAINER_BUILD_FLAGS='--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max'
      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Validate examples
        run: make validate-examples TERRAFORM_VERSION=${{ matrix.terraform }}

  acceptance:
    name: Hosted ClearML acceptance (${{ matrix.terraform }})
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.6.6", "1.15.8"]
    env:
      CLEARML_API_HOST: ${{ secrets.CLEARML_API_HOST }}
      CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_ACCESSKEY }}
      CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_SECRETKEY }}
      CLEARML_ENTERPRISE_ACC: ${{ secrets.CLEARML_ENTERPRISE_ACC }}
      CLEARML_ENTERPRISE_TEST_GROUP_ID: ${{ secrets.CLEARML_ENTERPRISE_TEST_GROUP_ID }}
      CLEARML_ENTERPRISE_TEST_PROFILE_ID: ${{ secrets.CLEARML_ENTERPRISE_TEST_PROFILE_ID }}
      TF_ACC_TERRAFORM_VERSION: ${{ matrix.terraform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/.buildx-cache
            .cache/devcontainer
          key: devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-${{ matrix.terraform }}-${{ hashFiles('.devcontainer/Dockerfile', 'go.mod', 'go.sum', 'Makefile') }}
          restore-keys: |
            devcontainer-${{ runner.os }}-${{ runner.arch }}-terraform-${{ matrix.terraform }}-
      - name: Build devcontainer image
        run: |
          make image \
            TERRAFORM_VERSION=${{ matrix.terraform }} \
            DOCKER_BUILD='docker buildx build --load' \
            DEVCONTAINER_BUILD_FLAGS='--cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max'
      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Clean stale acceptance queues
        run: make cleanupacc TERRAFORM_VERSION=${{ matrix.terraform }}
      - name: Run hosted ClearML acceptance tests
        run: make testacc TERRAFORM_VERSION=${{ matrix.terraform }}
      - name: Clean stale acceptance queues after test
        if: always()
        run: make cleanupacc TERRAFORM_VERSION=${{ matrix.terraform }}
